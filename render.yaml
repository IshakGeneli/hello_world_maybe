services:
  - type: web
    name: hello-world-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # Render kurulumda soracak: Neon bağlantı adresini yapıştır
