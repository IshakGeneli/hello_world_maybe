name: Backend Test

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: photos
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/photos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Eski şemayı kur (yükseltme denensin diye)
        run: |
          psql "$DATABASE_URL" -c "CREATE TABLE photos (id SERIAL PRIMARY KEY, filename TEXT NOT NULL, mime_type TEXT NOT NULL, size_bytes INTEGER NOT NULL, data BYTEA NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now())"
      - name: Sunucuyu başlat
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
      - name: Uç noktaları dene
        run: node test/smoke.js
      - name: Yeniden başlatınca şema bozulmasın
        run: |
          pkill -f "node server.js" || true
          sleep 1
          npm start >> server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf localhost:3000/places
      - if: always()
        run: cat server.log
