name: Android APK Derle

# Sadece elle başlatılınca derlenir (push'ta otomatik çalışmaz)
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Bu derlemede test edilecekler (Release açıklamasına yazılır)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ klasörü repoda yoksa otomatik oluşturulur
      - name: Android platform dosyalarını hazırla
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms android --org com.example --project-name hello_world
          fi
          # Gerekli izinler: internet (sunucu), konum (şu anki konumum)
          M=android/app/src/main/AndroidManifest.xml
          for P in INTERNET ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            if ! grep -q "android.permission.$P\"" "$M"; then
              sed -i "0,/<manifest[^>]*>/s##&\n    <uses-permission android:name=\"android.permission.$P\"/>#" "$M"
            fi
            grep -q "android.permission.$P\"" "$M"
          done
          grep -n 'uses-permission' "$M"

      - run: flutter pub get

      - name: Kod kontrolü
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: APK derle
        run: flutter build apk --release

      # Telefondan kolay indirmek için GitHub Releases'e yükle
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ inputs.notes }}
          files: build/app/outputs/flutter-apk/app-release.apk
