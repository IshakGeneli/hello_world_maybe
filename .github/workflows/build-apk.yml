name: Android APK Derle

# Sadece elle başlatılınca derlenir (push'ta otomatik çalışmaz)
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Bu derlemede test edilecekler (Release açıklamasına yazılır)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ klasörü repoda yoksa otomatik oluşturulur
      - name: Android platform dosyalarını hazırla
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms android --org com.example --project-name hello_world
          fi
          # Release APK'nın sunucuya bağlanabilmesi için internet izni
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$M"; then
            sed -i '0,/<manifest[^>]*>/s##&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$M"
          fi
          grep -n 'INTERNET' "$M"

      - run: flutter pub get

      - name: APK derle
        run: flutter build apk --release

      # Telefondan kolay indirmek için GitHub Releases'e yükle
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ inputs.notes }}
          files: build/app/outputs/flutter-apk/app-release.apk
